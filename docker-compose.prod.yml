version: '3.4'

services:
  server:
    image: ghcr.io/dupreehkuda/taskbingo-server-prod:latest
    container_name: taskbingo-server
    environment:
      - GAME_SERVICE_ADDRESS=${GAME_SERVICE_ADDRESS}
      - DATABASE_DSN=${PSQL_DSN_SERVER}
      - secret=${SECRET}
      - CURRENT_DOMAIN=${CURRENT_DOMAIN}
      - ALLOWED_WS_ORIGINS=${ALLOWED_WS_ORIGINS}
      - MIGRATIONS_PATH=/app/migrations/postgresql
    env_file: .env
    ports:
      - '8082:8082'
    restart: always
