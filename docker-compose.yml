version: '3.9'

# Production deploy. Auto-detected by Timeweb (and any other "drop-in
# compose" host) because the file is named docker-compose.yml.
#
# - Server (Go monolith) runs migrations on startup and listens on :8082.
# - Web (SvelteKit + adapter-node) listens on :3000.
# - Nginx is the only externally-exposed service: routes /api and /ws to
#   the server, everything else to the web. Same-origin in the browser
#   → no CORS surprises.
# - External Postgres (Timeweb DBaaS) — DATABASE_DSN comes from .env.
#
# Local development uses docker-compose.local.yml instead, which spins up
# its own Postgres and binds dev-friendly ports. See `make compose-local`.

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskbingo-server
    restart: always
    env_file: .env
    environment:
      - GAME_SERVICE_ADDRESS=:8082
      - DATABASE_DSN=${DATABASE_DSN}
      - secret=${SECRET}
      - CURRENT_DOMAIN=${CURRENT_DOMAIN}
      - ALLOWED_WS_ORIGINS=${ALLOWED_WS_ORIGINS}
      - MIGRATIONS_PATH=/app/migrations/postgresql
    expose:
      - '8082'

  web:
    build:
      context: ./bingo-app
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_WS_URL: ${VITE_WS_URL}
        VITE_WEB_URL: ${VITE_WEB_URL}
    container_name: taskbingo-web
    restart: always
    depends_on:
      - server
    expose:
      - '3000'

  nginx:
    image: nginx:1.27-alpine
    container_name: taskbingo-nginx
    restart: always
    depends_on:
      - server
      - web
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
