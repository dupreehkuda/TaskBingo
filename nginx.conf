# Single-port reverse proxy for the Timeweb deploy. Listens on :80 inside
# the container; Timeweb's edge handles TLS and forwards to this port.
#
# All requests to /api/... and /api/game/start (WebSocket) go to the Go
# backend. Everything else is served by the SvelteKit node-adapter app.

upstream taskbingo_server {
    server server:8082;
}

upstream taskbingo_web {
    server web:3000;
}

server {
    listen 80;
    server_name _;

    # Reasonable timeouts (WebSocket needs the long read for ping/pong).
    proxy_read_timeout 3600s;
    proxy_send_timeout 60s;
    proxy_connect_timeout 5s;
    client_max_body_size 1m;

    # JSON / REST endpoints + WebSocket upgrade for /api/game/start.
    location /api/ {
        proxy_pass http://taskbingo_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade — required for /api/game/start.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Everything else: the SvelteKit app.
    location / {
        proxy_pass http://taskbingo_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
